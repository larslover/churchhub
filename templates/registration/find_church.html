{% extends "base.html" %}

{% block content %}
<div class="container mt-4">

<h2>Find Your Church</h2>

<form method="get" class="mb-3">
    <input type="text"
           name="q"
           class="form-control"
           placeholder="Search church name..."
           value="{{ query }}">
</form>

{% for org in organizations %}
<div class="card p-3 mb-3">
    <h5>{{ org.name }}</h5>

    <a href="/accounts/request-access/{{ org.id }}/"
       class="btn btn-success">
       Request Access
    </a>
</div>
{% empty %}
<p>No churches found.</p>
{% endfor %}

</div>
{% endblock %}

{% extends "base.html" %}
{% block content %}

<div class="container">

    <div class="card p-4">

        <h3>Edit Group</h3>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <label>Group Name</label>
            <input type="text"
                   name="name"
                   class="form-control mb-3"
                   value="{{ group.name }}">

            <label>Description</label>
            <textarea name="description"
                      class="form-control mb-3">{{ group.description }}</textarea>

            <label>Group Image</label>
            {% if group.image %}
                <img src="{{ group.image.url }}" width="120" class="mb-2 rounded">
            {% endif %}

            <input type="file"
                   name="image"
                   class="form-control mb-3">

            <button class="btn btn-success w-100">
                Save Changes
            </button>
        </form>

    </div>

</div>

{% endblock %}

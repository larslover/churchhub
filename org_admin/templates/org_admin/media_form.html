{% extends "base.html" %}

{% block title %}Media{% endblock %}

{% block content %}
<div class="container py-4" style="max-width:700px;">

<h2 class="mb-4">
{% if media %}Edit{% else %}Add{% endif %} Media
</h2>

<form method="post">
{% csrf_token %}

<div class="mb-3">
<label>Title</label>
<input type="text"
       name="title"
       class="form-control"
       value="{{ media.title|default:'' }}"
       required>
</div>

<div class="mb-3">
<label>Type</label>
<select name="media_type" class="form-select">

<option value="video">Video</option>
<option value="audio">Audio</option>

</select>
</div>

<div class="mb-3">
<label>YouTube Link</label>
<input type="url"
       name="media_url"
       class="form-control"
       value="{{ media.media_url|default:'' }}"
       required>
</div>

<button class="btn btn-primary">
Save Media
</button>

</form>
</div>
{% endblock %}

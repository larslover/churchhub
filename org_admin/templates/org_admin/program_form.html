{% extends "base.html" %}

{% block title %}Program Form{% endblock %}

{% block content %}
<div class="container py-4">

    <h2 class="fw-bold mb-4">
        {% if program %}Edit Program{% else %}Create Program{% endif %}
    </h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text"
                   name="title"
                   class="form-control"
                   value="{{ program.title|default:'' }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description"
                      class="form-control"
                      rows="4">{{ program.description|default:'' }}</textarea>
        </div>

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">Day</label>
                <input type="text"
                       name="day"
                       class="form-control"
                       value="{{ program.day|default:'' }}">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Time</label>
                <input type="text"
                       name="time"
                       class="form-control"
                       value="{{ program.time|default:'' }}">
            </div>

        </div>

        <div class="mb-3">
            <label class="form-label">Image</label>
            <input type="file"
                   name="image"
                   class="form-control">
        </div>

        <button class="btn btn-primary">
            Save Program
        </button>

        <a href="{% url 'org_admin:program_list' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>
{% endblock %}

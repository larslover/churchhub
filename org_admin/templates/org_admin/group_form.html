{% extends "base.html" %}

{% block title %}Group Form{% endblock %}

{% block content %}
<div class="container py-4">

    <h3 class="fw-bold mb-4">
        {% if group %}Edit Group{% else %}Create Group{% endif %}
    </h3>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Group Name</label>
            <input type="text"
                   name="name"
                   class="form-control"
                   value="{{ group.name|default:'' }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description"
                      class="form-control"
                      rows="3">{{ group.description|default:'' }}</textarea>
        </div>

        <!-- LEADER SELECT -->
        <div class="mb-3">
            <label class="form-label">Assign Leader</label>

            <select name="leader" class="form-select">
                <option value="">-- No Leader --</option>

                {% for m in members %}
                <option value="{{ m.user.id }}"
                    {% if group.leader and group.leader.id == m.user.id %}
                        selected
                    {% endif %}>
                    {{ m.user }}
                </option>
                {% endfor %}
            </select>
        </div>

        <button class="btn btn-primary">
            Save Group
        </button>

        <a href="{% url 'org_admin:group_list' %}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>
{% endblock %}

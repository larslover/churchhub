{% extends "base.html" %}

{% block content %}
<div class="container py-5">

<h2>Delete Devotional</h2>

<p>
Are you sure you want to delete
<strong>{{ devotional.title }}</strong>?
</p>

<form method="post">
{% csrf_token %}

<button class="btn btn-danger">
Delete
</button>

<a href="{% url 'org_admin:devotional_list' %}"
class="btn btn-secondary">
Cancel
</a>

</form>

</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Series{% endblock %}

{% block content %}

<h1>Series</h1>

{% if series %}

    <ul class="list-group">
        {% for item in series %}
            <li class="list-group-item">
                {{ item.title }}
            </li>
        {% endfor %}
    </ul>

{% else %}

    <div class="alert alert-info">
        No series have been added yet.
    </div>

{% endif %}

{% endblock %}

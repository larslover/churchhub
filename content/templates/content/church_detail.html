{% extends "base.html" %}

{% block content %}

<div class="mb-4">

    <h1>{{ church.city }}</h1>

    <p class="text-muted">
        {{ church.country }}
    </p>

</div>

<div class="card shadow-sm">

    <div class="card-body">

        <h5>Church Information</h5>

        <table class="table table-borderless mb-0">

            <tr>
                <th width="150">City</th>
                <td>{{ church.city }}</td>
            </tr>

            <tr>
                <th>Country</th>
                <td>{{ church.country }}</td>
            </tr>

            <tr>
                <th>Added</th>
                <td>{{ church.created_at|date:"F j, Y" }}</td>
            </tr>

        </table>

    </div>

</div>

<div class="mt-4">
    <a href="{% url 'church_list' %}" class="btn btn-secondary">
        ← Back to Churches
    </a>
</div>

{% endblock %}
